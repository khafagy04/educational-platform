name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          {
            POSTGRES_DB: educational_platform,
            POSTGRES_USER: platform,
            POSTGRES_PASSWORD: platform_dev_only,
          }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U platform -d educational_platform" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://platform:platform_dev_only@localhost:5432/educational_platform
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      RUN_DATABASE_TESTS: 'true'
      RUN_QUEUE_TESTS: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run db:generate --workspace backend
      - run: npm run db:migrate:deploy --workspace backend
      - run: npm run db:seed --workspace backend
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --omit=optional --audit-level=high
