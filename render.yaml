services:
  - type: web
    name: midad-dashboard-api-khafagy04
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile.dashboard
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_PEPPER
        generateValue: true
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: '900'
      - key: REFRESH_TOKEN_TTL_DAYS
        value: '30'
      - key: JOB_QUEUE_ENABLED
        value: 'false'
      - key: REDIS_URL
        value: redis://127.0.0.1:6379
      - key: EMAIL_PROVIDER
        value: local
      - key: STORAGE_PROVIDER
        value: local
      - key: LOCAL_STORAGE_PATH
        value: /tmp/midad-storage
      - key: VIDEO_PROVIDER
        value: local
      - key: PAYMENT_PROVIDER
        value: local
      - key: DEMO_SEED_ENABLED
        value: 'true'
      - key: SEED_INSTRUCTOR_EMAIL
        sync: false
      - key: SEED_INSTRUCTOR_PASSWORD
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_STUDENT_EMAIL
        sync: false
      - key: SEED_STUDENT_PASSWORD
        sync: false
